<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Soft Sky Blue App Icon Background -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Badge White Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Parcel Box Shading Gradients -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Truck Gradient -->
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0369a1" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Main Rounded Icon Container -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#appBg)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner Circle Plate with Shadow -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="200" fill="url(#badgeBg)" stroke="#0284c7" stroke-width="8" />
  </g>

  <!-- Track Ring (Blue + Orange Arc) -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#bae6fd" stroke-width="22" />
  <circle cx="256" cy="256" r="158" fill="none" stroke="#0284c7" stroke-width="10" />

  <!-- Orange Pathway Arc at Bottom-Right -->
  <path d="M 256 414 A 158 158 0 0 0 414 256" fill="none" stroke="#fb923c" stroke-width="26" stroke-linecap="round" />
  <path d="M 256 414 A 158 158 0 0 0 414 256" fill="none" stroke="#ea580c" stroke-width="10" stroke-linecap="round" />

  <!-- 1. Top Center Gear / Settings Icon -->
  <g transform="translate(256, 110)">
    <circle cx="0" cy="0" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="6" />
    <!-- Gear teeth -->
    <path d="M -6 -34 L 6 -34 L 8 -26 L -8 -26 Z 
             M -6 34 L 6 34 L 8 26 L -8 26 Z
             M -34 -6 L -34 6 L -26 8 L -26 -8 Z
             M 34 -6 L 34 6 L 26 8 L 26 -8 Z
             M -24 -24 L -16 -30 L -12 -20 L -20 -14 Z
             M 24 24 L 16 30 L 12 20 L 20 14 Z
             M -24 24 L -30 16 L -20 12 L -14 20 Z
             M 24 -24 L 30 -16 L 20 -12 L 14 -20 Z" fill="#0284c7" />
    <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="5" />
  </g>

  <!-- 2. Top-Left Order Sheet / Cart Document -->
  <g transform="translate(100, 145)" filter="url(#softShadow)">
    <rect x="0" y="0" width="76" height="96" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="5" />
    <!-- Mini Shopping Cart -->
    <path d="M 18 24 L 26 24 L 32 44 L 56 44 L 60 30 L 28 30" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="35" cy="50" r="3" fill="#0284c7" />
    <circle cx="52" cy="50" r="3" fill="#0284c7" />
    <!-- Document Lines -->
    <line x1="18" y1="62" x2="58" y2="62" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <line x1="18" y1="72" x2="48" y2="72" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <line x1="18" y1="82" x2="38" y2="82" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 3. Top-Right Analytics Dashboard Window -->
  <g transform="translate(330, 150)" filter="url(#softShadow)">
    <rect x="0" y="0" width="92" height="74" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="5" />
    <path d="M 0 12 C 0 5.4, 5.4 0, 12 0 L 80 0 C 86.6 0, 92 5.4, 92 12 L 92 20 L 0 20 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" />
    <!-- Window Dots -->
    <circle cx="12" cy="10" r="3" fill="#38bdf8" />
    <circle cx="22" cy="10" r="3" fill="#0284c7" />
    <!-- Pie Chart & Bar Graph inside -->
    <path d="M 24 45 L 24 32 A 13 13 0 0 1 37 45 Z" fill="#f97316" />
    <path d="M 24 45 L 37 45 A 13 13 0 1 1 24 32 Z" fill="#0284c7" />
    <!-- Bar chart bars -->
    <rect x="52" y="44" width="8" height="18" rx="2" fill="#0284c7" />
    <rect x="64" y="34" width="8" height="28" rx="2" fill="#f97316" />
    <rect x="76" y="28" width="8" height="34" rx="2" fill="#0284c7" />
  </g>

  <!-- 4. Central Isometric 3D Box (Parcel) -->
  <g transform="translate(256, 260)" filter="url(#softShadow)">
    <!-- Top Face -->
    <polygon points="0,-60 65,-28 0,4 -65,-28" fill="url(#boxTop)" stroke="#0f766e" stroke-width="4" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="-65,-28 0,4 0,68 -65,36" fill="url(#boxLeft)" stroke="#0f766e" stroke-width="4" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="0,4 65,-28 65,36 0,68" fill="url(#boxRight)" stroke="#0f766e" stroke-width="4" stroke-linejoin="round" />
    <!-- Tape Stripe on Top Face -->
    <polygon points="0,-52 18,-43 -12,-28 -30,-37" fill="#ffffff" opacity="0.75" />
    <polygon points="-12,-28 18,-43 32,-36 2,-21" fill="#ffffff" opacity="0.65" />
    <!-- Shipping Sticker on Left Face -->
    <polygon points="-48,0 -20,14 -20,30 -48,16" fill="#ffffff" opacity="0.9" />
    <line x1="-42" y1="8" x2="-26" y2="16" stroke="#0f766e" stroke-width="3" />
    <line x1="-42" y1="14" x2="-32" y2="19" stroke="#0f766e" stroke-width="3" />

    <!-- Verified Checkmark Badge at Bottom Right -->
    <g transform="translate(42, 36)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#0284c7" stroke-width="4" />
      <circle cx="0" cy="0" r="18" fill="#38bdf8" />
      <path d="M -7 -1 L -2 4 L 7 -5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- 5. Delivery Truck (Bottom Right) -->
  <g transform="translate(285, 335)" filter="url(#softShadow)">
    <!-- Motion Speed Lines behind truck -->
    <line x1="-28" y1="18" x2="-12" y2="18" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
    <line x1="-36" y1="28" x2="-16" y2="28" stroke="#ea580c" stroke-width="5" stroke-linecap="round" />
    <!-- Truck Container Body -->
    <rect x="-10" y="0" width="60" height="36" rx="6" fill="url(#truckBody)" stroke="#0284c7" stroke-width="4" />
    <!-- Truck Cabin -->
    <path d="M 50 12 L 68 12 C 74 12, 78 16, 80 22 L 82 36 L 50 36 Z" fill="#0284c7" stroke="#0369a1" stroke-width="4" stroke-linejoin="round" />
    <!-- Cabin Window -->
    <path d="M 54 16 L 66 16 L 72 24 L 54 24 Z" fill="#e0f2fe" />
    <!-- Wheels -->
    <circle cx="8" cy="38" r="10" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <circle cx="8" cy="38" r="4" fill="#94a3b8" />
    <circle cx="64" cy="38" r="10" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <circle cx="64" cy="38" r="4" fill="#94a3b8" />
  </g>

  <!-- 6. Curved Workflow Arrow Loops (Bottom Left to Box) -->
  <g fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow 1: From Order Doc down to Parcel -->
    <path d="M 130 250 C 120 300, 140 360, 220 395" stroke-dasharray="100" stroke="#0284c7" stroke-width="12" />
    <path d="M 130 250 C 120 300, 140 360, 220 395" stroke="#38bdf8" stroke-width="6" />
    <!-- Arrowhead 1 -->
    <path d="M 120 262 L 130 248 L 142 262" fill="#0284c7" stroke="none" />

    <!-- Arrow 2: Outer Blue Loop -->
    <path d="M 180 390 C 260 440, 360 410, 380 380" stroke="#0284c7" stroke-width="12" />
    <path d="M 180 390 C 260 440, 360 410, 380 380" stroke="#38bdf8" stroke-width="6" />
    <path d="M 270 410 L 290 422 L 270 434" fill="#0284c7" stroke="none" />
  </g>
</svg>
