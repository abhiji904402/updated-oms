<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Broomies Bakery - Delivery & OMS App</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Standard Favicons & App Icons for Chrome, Android & Desktop -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />

    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" />

    <!-- Web App Branding -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Broomies Rider" />
    <meta name="application-name" content="Broomies Rider" />
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes broomies-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes broomies-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.85; transform: scale(0.96); }
        }
      </style>
      <div style="min-height: 100vh; background-color: #070913; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; text-align: center;">
        <div style="position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(168, 85, 247, 0.15); border-top-color: #a855f7; border-right-color: #ec4899; animation: broomies-spin 0.9s linear infinite;"></div>
          <img src="/app-icon.svg" alt="Broomies Logo" style="width: 56px; height: 56px; border-radius: 16px; object-fit: cover; box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35); animation: broomies-pulse 1.8s ease-in-out infinite; border: 2px solid rgba(168, 85, 247, 0.4); background-color: #0f172a;" />
        </div>
        <div style="font-weight: 900; font-size: 20px; letter-spacing: 1.5px; color: #ffffff; text-transform: uppercase;">BROOMIES BAKERY</div>
        <div style="font-size: 12px; font-weight: 600; color: #a855f7; margin-top: 6px; letter-spacing: 0.5px;">Order Management & Delivery Portal</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
